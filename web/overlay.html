<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CoD HUD overlay</title>
<!--
  The overlay: a 1920x1080 browser source for vMix / OBS, laid over the game.
  It sits on the CoD caster HUD (the NEW COD OVERLAY vMix title, placed as in
  CDL broadcasts):
    - each team's name plate over the HUD's team bars: the team's name, with a
      strip of its logo at the outer end;
    - the team logos in the score box, over the game's own;
    - the series score in place of the game's pips (over "BEST OF");
    - the spectated player's webcam, left of their player card;
    - the sponsors, one after another, under the middle of the screen.
  Everything shows only while the CoD caster HUD is on screen (the score box
  parts also while only the score box is up). Teams, logos, scores and
  sponsors are the HUD's match, which follows the GFX Engine's Global
  information.
-->
<style>
  @font-face { font-family: "SCC fallback"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .part { position: absolute; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  .part.on { opacity: 1; }
  .abs { position: absolute; }
  .clip { position: absolute; overflow: hidden; }
  .logo { position: absolute; object-fit: contain; }
  /* The name plates: the title's box art, the name, the logo strip. */
  .plate { width: 611px; height: 52px; background: center / 100% 100% no-repeat; }
  .plate.left { left: 42px; top: 17px; background-image: url("assets/overlay/box-left.png"); }
  .plate.right { left: 1266px; top: 16px; width: 612px; height: 53px; background-image: url("assets/overlay/box-right.png"); }
  .name { position: absolute; top: 0; height: 100%; display: flex; align-items: center; color: #fff; white-space: nowrap;
          font-family: var(--f-name); font-size: 46px; font-weight: 800; text-transform: uppercase; letter-spacing: -.005em; line-height: 1; }
  .name span { display: block; transform: translateY(.03em); }
  .plate.left .name { left: 242px; width: 359px; justify-content: flex-end; }
  .plate.right .name { left: 10px; width: 359px; }
  /* The score box: a dark backing over the game's logo, the team's logo on it. */
  .mini-bg { background: #131519; }
  /* The series score, over the game's pips. */
  .pip-cover { background: #14151B; }
  .pip { position: absolute; top: 28px; width: 11px; height: 11px; background: #4e4f55; }
  .pip.won { background: var(--won, #fff); }
  .best-of { position: absolute; left: 899px; top: 20px; width: 122px; height: 27px; background: #23252D; color: #fff;
             display: flex; align-items: center; justify-content: center; font: 500 19px "SCC fallback", sans-serif; letter-spacing: .02em; }
  /* The webcam: CDL's place, left of the game's player card. */
  #cam { left: 1238px; top: 896px; width: 175px; height: 130px; background: #0c0d10; overflow: hidden;
         transform: translateX(12px); transition: opacity .25s ease, transform .35s cubic-bezier(.2, .8, .2, 1); }
  #cam.on { transform: none; }
  #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  #cam video.on { opacity: 1; }
  #cam .dummy { position: absolute; inset: 0; display: none; background: radial-gradient(circle at 50% 38%, #4a4c58, #1b1c22 72%); }
  #cam .dummy.on { display: block; }
  #cam .dummy i { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font: 600 11px "SCC fallback", sans-serif;
                  letter-spacing: .12em; color: #fff9; font-style: normal; }
  #cam .dummy b { position: absolute; left: 0; right: 0; top: 46px; text-align: center; font: 800 20px "SCC fallback", sans-serif; color: #fff; }
  /* The sponsors: CDL's box under the middle of the screen. */
  #sponsor { left: 857px; top: 939px; width: 206px; height: 97px; background: rgba(46, 44, 42, .94);
             box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .85); }
  #sponsor::before { content: ""; position: absolute; left: 4px; top: 0; width: 22px; height: 3px; background: #fff; }
  #sponsor img { position: absolute; left: 18px; top: 12px; width: 170px; height: 73px; object-fit: contain; opacity: 0; transition: opacity .4s ease; }
  #sponsor img.on { opacity: 1; }
</style>
<style id="fonts"></style>
</head>
<body>
<div class="part" id="plates"></div>
<div class="part" id="logos"></div>
<div class="part" id="pips"></div>
<div class="part" id="cam"><div class="videos"></div><div class="dummy"><b></b><i>DEMO CAM</i></div></div>
<div class="part" id="sponsor"></div>
<script src="cams.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var state = { hud: "off" }, look = null, builtKey = null;

  function esc(text) {
    return String(text == null ? "" : text).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function src(path) { return /^(https?:|data:)/.test(path || "") ? path : "/" + String(path || "").split("/").map(encodeURIComponent).join("/"); }
  function img(path, x, y, w, h) {
    return path ? '<img class="logo" src="' + esc(src(path)) + '" style="left:' + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + 'px" alt="">' : "";
  }
  function box(cls, x, y, w, h, inner) {
    return '<div class="' + cls + '" style="left:' + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + 'px">' + (inner || "") + "</div>";
  }
  // A long team name shrinks to fit its box.
  function fit() {
    Array.prototype.forEach.call(document.querySelectorAll(".name"), function (el) {
      var span = el.firstChild, size = 46;
      if (!span) return;
      span.style.fontSize = "";
      while (span.scrollWidth > el.clientWidth && size > 14) { size -= 1; span.style.fontSize = size + "px"; }
    });
  }

  function build() {
    var m = look.match, key = JSON.stringify([m, look.fonts]);
    if (key === builtKey) return;
    builtKey = key;
    var fam = String((look.fonts || {}).name || "").replace(/["\\]/g, "");
    $("fonts").textContent = (fam ? '@font-face { font-family: "SCC name"; src: local("' + fam + '"), url("/fonts/local/' + encodeURIComponent(fam) + '"); font-weight: 100 900; }' : "") +
      ":root { --f-name: " + (fam ? '"' + fam + '", "SCC name", ' : "") + '"SCC fallback", sans-serif; }';
    var L = m.left || {}, R = m.right || {};
    // The name plates: the logo strip (the title's crop of a 193px logo) at the outer end.
    $("plates").innerHTML =
      '<div class="clip plate left">' + img(L.logo, 9 + 28.5, -58.5, 193, 193) + '<div class="name"><span>' + esc(L.name) + "</span></div></div>" +
      '<div class="clip plate right">' + img(R.logo, 364 + 28.5, -53.5, 193, 193) + '<div class="name"><span>' + esc(R.name) + "</span></div></div>";
    // The score box's logos, over the game's.
    $("logos").innerHTML = box("abs mini-bg", 734, 55, 67, 93) + box("abs mini-bg", 1116, 55, 68, 93) +
      img(L.logo, 734, 64, 75, 75) + img(R.logo, 1109, 64, 75, 75);
    // The series score: a pip per map needed to win, inner ones first.
    var need = Math.min(5, Math.max(1, Math.ceil((Number(m.best_of) || 1) / 2)));
    // (the game's own, up to 5 a side, covered)
    var pips = box("abs pip-cover", 794, 25, 90, 17) + box("abs pip-cover", 1038, 25, 90, 17);
    for (var k = 0; k < need; k++) {
      pips += '<div class="pip' + ((L.wins || 0) > k ? " won" : "") + '" style="left:' + (866 - 17 * k) + "px;--won:" + esc(L.color || "#fff") + '"></div>';
      pips += '<div class="pip' + ((R.wins || 0) > k ? " won" : "") + '" style="left:' + (1042 + 17 * k) + "px;--won:" + esc(R.color || "#fff") + '"></div>';
    }
    // ("BEST OF n" too, so it says the same as the pips)
    $("pips").innerHTML = pips + '<div class="best-of">BEST OF ' + esc(m.best_of) + "</div>";
    fit();
    if (document.fonts) document.fonts.ready.then(fit);
  }

  // The sponsors: one after another, each for its seconds.
  var sponsorKey = null, sponsorAt = 0, sponsorIndex = 0;
  function sponsors(now) {
    var list = look.sponsors || [], key = JSON.stringify(list), el = $("sponsor");
    if (key !== sponsorKey) {
      sponsorKey = key;
      el.innerHTML = list.map(function (s) { return '<img src="' + esc(src(s.src)) + '" alt="">'; }).join("");
      sponsorIndex = 0; sponsorAt = now;
    }
    if (list.length > 1 && now - sponsorAt >= (Number(list[sponsorIndex].secs) || 10) * 1000) {
      sponsorIndex = (sponsorIndex + 1) % list.length; sponsorAt = now;
    }
    Array.prototype.forEach.call(el.children, function (im, i) { im.classList.toggle("on", i === sponsorIndex); });
    return list.length > 0;
  }

  function frame(now) {
    if (look) {
      build();
      var o = look.overlay || {}, on = state.hud === "on", up = state.hud !== "off";
      $("plates").classList.toggle("on", on && o.plates !== false);
      $("logos").classList.toggle("on", up && o.logos !== false);
      $("pips").classList.toggle("on", up && o.pips !== false);
      $("sponsor").classList.toggle("on", sponsors(now) && on && o.sponsor !== false);
      window.renderCam(state, look, on && o.cam !== false && look.cams !== false);
    }
    requestAnimationFrame(frame);
  }

  function connect() {
    var es = new EventSource("/api/stream");
    es.onmessage = function (ev) {
      var msg = JSON.parse(ev.data);
      if (msg.look) look = msg.look;
      state = msg;
      window.codHud = { state: state, look: look };   // (for checking the overlay)
    };
    // The app has closed or restarted: show nothing until it's back.
    es.onerror = function () { state = { hud: "off" }; };
  }

  connect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
